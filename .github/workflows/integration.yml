# Docker-based Samba integration suite, exercised through both transports.
#
# The `seam` leg routes the suite through the NIO TCP transport (TCPTransportApple + bridge +
# the no-fd servicing loop); the `legacy` leg uses libsmb2's built-in socket. The seam transport
# is Apple-only (Network.framework), so this job runs on macOS and provisions Docker via Colima.
#
# NOTE: This workflow is authored as part of T8 (#27) and has NOT yet been executed — its first
# run is on CI / a human Docker host. It requires a runner with a working Docker daemon.
name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'AMSMB2/**'
      - 'AMSMB2Tests/**'
      - 'Dependencies/**'
      - 'scripts/test-integration.sh'
      - 'test-fixtures/**'
      - '.github/workflows/integration.yml'

jobs:
  samba:
    name: Samba (${{ matrix.transport }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # Run the full acceptance matrix once over the legacy path and once over the seam, so a
        # regression in either transport is caught. Outcomes are expected to be identical (T8.3).
        transport: [ legacy, seam ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Provision Docker (Colima)
        run: |
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 4

      - name: Run integration suite (${{ matrix.transport }})
        env:
          SMB_TRANSPORT: ${{ matrix.transport }}
        run: make integrationtest
