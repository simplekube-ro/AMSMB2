# Docker-based Samba integration suite, exercised through BOTH transports — each on the host
# where that transport actually runs:
#
#   * seam  (macOS)  — routes the suite through the NIO TCP transport (TCPTransportApple + bridge +
#                      the no-fd servicing loop). Apple-only (Network.framework), so it runs on
#                      macOS with Docker provisioned via Colima.
#   * legacy (Linux) — uses libsmb2's built-in socket / DispatchSource path. After the T9 flip the
#                      legacy path is COMPILED OUT on Apple, so a meaningful "legacy" leg can only
#                      run on Linux (its sole remaining consumer). Docker is native on the runner.
#
# This split is deliberate: post-T9 there is no Apple legacy path, so a legacy-vs-seam comparison
# cannot happen on a single host. Running legacy on Linux and seam on macOS against the same Samba
# fixture and the same suite is the real both-ways comparison (see
# openspec/changes/fix-seam-connect-ordering/design.md, C4 reconciliation). Outcomes are expected
# to be identical (no observable behavior difference for TCP).
#
# NOTE: first executed on CI / a human Docker host. Each job requires a working Docker daemon.
name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'AMSMB2/**'
      - 'AMSMB2Tests/**'
      - 'Dependencies/**'
      - 'scripts/test-integration.sh'
      - 'test-fixtures/**'
      - '.github/workflows/integration.yml'

jobs:
  seam-macos:
    name: Samba (seam, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Provision Docker (Colima)
        run: |
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 4

      - name: Run integration suite (seam)
        env:
          SMB_TRANSPORT: seam
        run: make integrationtest

  legacy-linux:
    name: Samba (legacy, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux runners ship Docker + the Compose v2 plugin natively; only the Swift toolchain
      # needs provisioning. The integration script auto-detects `docker compose` (v2).
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Run integration suite (legacy)
        env:
          SMB_TRANSPORT: legacy
        run: make integrationtest
